{% if can_edit %}<div class="editable-field" data-field="{{ field }}"><select aria-label="{{ label }}" class="autosave"{% if disabled %} disabled{% endif %}>{% for choice_value, choice_label in choices %}<option value="{{ choice_value }}"{% if value == choice_value %} selected{% endif %}>{{ choice_label }}</option>{% endfor %}</select></div>{% else %}{{ display }}{% if locked_reason %} <span class="formula field-locked-reason" data-locked-field="{{ field }}">{{ locked_reason }}</span>{% endif %}{% endif %}
