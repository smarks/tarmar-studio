name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request supersedes the run in
# progress: a stale run only spends minutes, or holds up the one self-hosted
# runner, that the current run needs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token's least permissions: every job reads the repository and nothing
# more. A job that needs another scope names it in its own block.
permissions:
  contents: read

jobs:
  test:
    # One run of the suite, against the generic default canon the repository
    # ships (issue #921). The Tarmar canon left for the private
    # smarks/tarmar-canon, and CI holds no credentials for it: with
    # TARMAR_CANON_DIR unset and no canon in the checkout, reference.paths
    # resolves reference/default_canon, which is the configuration of every
    # public checkout. The Tarmar canon is proven by `./run gate` with
    # TARMAR_CANON_DIR set (DEPLOY.md). Issue #920 ran this job twice, once
    # with the checkout's own canon; with none left in the checkout that entry
    # only repeated this one.
    name: test (default canon)
    # Where the job runs is the repository variable CI_RUNNER (issue #964):
    #   unset, or anything else  GitHub-hosted Ubuntu 24.04, billed minutes
    #   datahorde                the self-hosted runner in a container on
    #                            datahorde (the next change under #964)
    # Switch with `gh variable set CI_RUNNER --body datahorde` and back with
    # `gh variable delete CI_RUNNER`. The steps are the same in both: each
    # sets up its own uv, Python, Node and Playwright browser, so neither mode
    # depends on what a machine happens to hold. The required check keeps its
    # name either way, so branch protection is unaffected. The image is
    # pinned rather than ubuntu-latest, which GitHub moves to Ubuntu 26 on
    # 2026-10-19; a cached browser skips --with-deps and relies on the
    # image's own libraries, so the move is made on purpose, not by GitHub.
    runs-on: ${{ vars.CI_RUNNER == 'datahorde' && fromJSON('["self-hosted", "Linux", "tarmar-datahorde"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      # Clear of the main checkout's :8000 and the :82xx ports worktrees use by
      # hand, so a CI run never reuses or collides with a dev server someone is
      # working against. The fake Ollama sits at +1000.
      E2E_PORT: "8290"

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # Python 3.14, as the Mac, the gate and production run. Left to choose,
      # uv takes the newest CPython, and on 2026-10-09 that was 3.15.0, for
      # which Pillow (weasyprint's) has no wheel: the sync died compiling it.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python dependencies
        run: uv sync --locked --group cli

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: No model change without a migration
        run: DEBUG=true uv run python manage.py makemigrations --check --dry-run

      # build/ holds only the player-facing guides, built from public pages,
      # so they check the same under any canon (issue #921). The Game Master's
      # guides live in the canon's own repository.
      - name: Guides are current
        run: uv run python scripts/build_guides.py --check

      # The threshold is fixed and changed by hand, never ratcheted here.
      - name: Pytest
        run: ./run test -q --cov-fail-under=98

      - name: Jest
        run: npm test -- --coverage

      # The browser comes from actions/cache, keyed by the resolved
      # @playwright/test version so an upgrade is never served a stale one.
      # Restoring it skips `--with-deps`'s apt-get, whose third-party
      # repositories once failed a hosted build before any of our code ran
      # (2026-09-09). On datahorde the runner's image already holds the
      # browser's system libraries and the job has no root, so it never asks
      # for them. --only-shell: the suite runs headless with no `channel`.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --only-shell chromium

      # --check judges coverage against package.json's jsCoverageThreshold
      # and never rewrites it.
      - name: Playwright with JS coverage
        run: uv run python scripts/update_js_coverage_threshold.py --check

  notify:
    needs: [test]
    if: always()
    # The notify action asks `gh run list` for this workflow's previous run,
    # to tell a recovery from a first green; that read needs actions: read.
    # Without it the lookup fails quietly and no recovery mail is ever sent.
    permissions:
      actions: read
      contents: read
    runs-on: ${{ vars.CI_RUNNER == 'datahorde' && fromJSON('["self-hosted", "Linux", "tarmar-datahorde"]') || 'ubuntu-24.04' }}
    steps:
      - name: Email on failure or green-after-red
        uses: smarks/base_repo_template/.github/actions/notify@main
        with:
          job-status: ${{ needs.test.result }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
