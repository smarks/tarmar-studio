# The same forms live in smarks/tarmar-studio (public, where players file)
# and smarks/tarmar-studio-private (where sessions file). Change both.
name: General comment
description: Anything else about Tarmar Studio or the world of Tarmar.
labels: [comment]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to say?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much it matters.
      options:
        - "Trivial: just a comment"
        - "Minor: worth a look"
        - "Major: this matters"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How soon you'd like a reply.
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      description: GitHub already shows your username; put a name here only if you'd like to be credited differently. Optional.
