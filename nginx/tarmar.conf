# Tarmar Studio (Tarmar) - Nginx Configuration
# Blue-green deployment setup
#
# This file is the one source of truth for /etc/nginx/sites-available/tarmar
# on the deploy host (issue #179). deploy.sh installs it, and
# nginx/scanner-block.conf as /etc/nginx/snippets/tarmar-scanner-block.conf,
# on every deploy whose copy differs from the host's: it keeps a dated backup
# beside each file, runs `nginx -t`, and reloads nginx only when the test
# passes (install_nginx_config). Edit here and deploy; a change made on the
# host by hand is overwritten by the next deploy.
#
# The lines marked "managed by Certbot" are Certbot's own, kept exactly as it
# wrote them so a certificate renewal still finds its markers.
#
# First installation on a new host:
#   1. Copy tarmar-upstream.conf to /etc/nginx/conf.d/ (deploy.sh rewrites it
#      on every switch of colour)
#   2. Copy scanner-block.conf to /etc/nginx/snippets/tarmar-scanner-block.conf
#   3. Copy this file to /etc/nginx/sites-available/tarmar
#   4. ln -s /etc/nginx/sites-available/tarmar /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. (optional, closes issue #161 part 3) copy tarmar-proxy-secret.conf.example
#      to /etc/nginx/snippets/tarmar-proxy-secret.conf, fill in a random value,
#      set the same value as PROXY_SHARED_SECRET in tarmar's .env, reload both

# HTTP to HTTPS redirect (all domains)
server {
    if ($host = tarmar.origamisoftware.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tarmar.origamisoftware.com tarmar.duckdns.org melee.origamisoftware.com;
    return 301 https://$host$request_uri;


}

# HTTPS - origamisoftware.com multi-SAN cert (primary; melee added #267)
server {
    listen 443 ssl;
    server_name tarmar.origamisoftware.com melee.origamisoftware.com;
    ssl_certificate /etc/letsencrypt/live/origamisoftware.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/origamisoftware.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Vulnerability-scanner probes (/.env, /wp-login.php, /.git/...) are
    # dropped without a reply (issue #179); the rules are nginx/scanner-block.conf.
    include /etc/nginx/snippets/tarmar-scanner-block.conf;

    # Serve static files
    location /static/ {
        alias /home/sam/dev/tarmar-studio/staticfiles/;
    }

    # Proxy to active backend (blue or green)
    location / {
        # Shared secret proving this request came through nginx, not from
        # another process on this host that also connects to gunicorn over
        # loopback (issue #161 part 3; see PROXY_SHARED_SECRET in
        # .env.example). The default is empty, and the glob include below
        # is deliberately optional -- zero matching files is not a config
        # error, so this line needs no coordinated nginx-and-app rollout.
        # With no secret file present, the header goes out empty and the
        # app just falls back to its existing peer-IP-only check. Copy
        # tarmar-proxy-secret.conf.example to
        # /etc/nginx/snippets/tarmar-proxy-secret.conf (root-owned, not in
        # git) to turn it on, with the same value as tarmar's
        # PROXY_SHARED_SECRET.
        set $tarmar_proxy_secret "";
        include /etc/nginx/snippets/tarmar-proxy-secret*.conf;

        proxy_pass http://tarmar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Shared-Secret $tarmar_proxy_secret;
    }

}

# HTTPS - tarmar DuckDNS (legacy, own cert — pillars.duckdns.org retired)
server {
    listen 443 ssl;
    server_name tarmar.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/tarmar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarmar.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/tarmar-scanner-block.conf;

    location /static/ {
        alias /home/sam/dev/tarmar-studio/staticfiles/;
    }

    location / {
        # The shared secret, as in the block above (issue #161 part 3).
        set $tarmar_proxy_secret "";
        include /etc/nginx/snippets/tarmar-proxy-secret*.conf;

        proxy_pass http://tarmar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Shared-Secret $tarmar_proxy_secret;
    }
}
