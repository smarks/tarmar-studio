# Tarmar Studio (Tarmar) - Nginx Configuration
# Blue-green deployment setup
#
# Installation:
#   1. Copy tarmar-upstream.conf to /etc/nginx/conf.d/
#   2. Copy this file to /etc/nginx/sites-available/tarmar
#   3. ln -s /etc/nginx/sites-available/tarmar /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. (optional, closes issue #161 part 3) copy tarmar-proxy-secret.conf.example
#      to /etc/nginx/snippets/tarmar-proxy-secret.conf, fill in a random value,
#      set the same value as PROXY_SHARED_SECRET in tarmar's .env, reload both

# HTTP to HTTPS redirect (all domains)
server {
    listen 80;
    server_name tarmar.origamisoftware.com tarmar.duckdns.org melee.origamisoftware.com;
    return 301 https://$host$request_uri;
}

# HTTPS - origamisoftware.com multi-SAN cert (primary; melee added #267)
server {
    listen 443 ssl;
    server_name tarmar.origamisoftware.com melee.origamisoftware.com;

    ssl_certificate /etc/letsencrypt/live/origamisoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origamisoftware.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Serve reference documents (same-origin only; no directory listing or CORS)
    location /references/ {
        alias /home/sam/dev/tarmar-studio/references/;

        # Set proper content types
        types {
            text/markdown md;
            text/html html;
        }
    }

    # Serve static files
    location /static/ {
        alias /home/sam/dev/tarmar-studio/staticfiles/;
    }

    # Proxy to active backend (blue or green)
    location / {
        # Shared secret proving this request came through nginx, not from
        # another process on this host that also connects to gunicorn over
        # loopback (issue #161 part 3; see PROXY_SHARED_SECRET in
        # .env.example). The default is empty, and the glob include below
        # is deliberately optional -- zero matching files is not a config
        # error, so this line needs no coordinated nginx-and-app rollout.
        # With no secret file present, the header goes out empty and the
        # app just falls back to its existing peer-IP-only check. Copy
        # tarmar-proxy-secret.conf.example to
        # /etc/nginx/snippets/tarmar-proxy-secret.conf (root-owned, not in
        # git) to turn it on, with the same value as tarmar's
        # PROXY_SHARED_SECRET.
        set $tarmar_proxy_secret "";
        include /etc/nginx/snippets/tarmar-proxy-secret*.conf;

        proxy_pass http://tarmar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Shared-Secret $tarmar_proxy_secret;
    }
}

# HTTPS - tarmar DuckDNS (legacy, own cert — pillars.duckdns.org retired)
server {
    listen 443 ssl;
    server_name tarmar.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/tarmar.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarmar.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location /references/ {
        alias /home/sam/dev/tarmar-studio/references/;
        types {
            text/markdown md;
            text/html html;
        }
    }

    location /static/ {
        alias /home/sam/dev/tarmar-studio/staticfiles/;
    }

    location / {
        # Shared secret proving this request came through nginx, not from
        # another process on this host that also connects to gunicorn over
        # loopback (issue #161 part 3; see PROXY_SHARED_SECRET in
        # .env.example). The default is empty, and the glob include below
        # is deliberately optional -- zero matching files is not a config
        # error, so this line needs no coordinated nginx-and-app rollout.
        # With no secret file present, the header goes out empty and the
        # app just falls back to its existing peer-IP-only check. Copy
        # tarmar-proxy-secret.conf.example to
        # /etc/nginx/snippets/tarmar-proxy-secret.conf (root-owned, not in
        # git) to turn it on, with the same value as tarmar's
        # PROXY_SHARED_SECRET.
        set $tarmar_proxy_secret "";
        include /etc/nginx/snippets/tarmar-proxy-secret*.conf;

        proxy_pass http://tarmar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Shared-Secret $tarmar_proxy_secret;
    }
}
