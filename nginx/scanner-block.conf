# Vulnerability-scanner probes, dropped without a reply (issue #179).
#
# Included by both HTTPS server blocks of nginx/tarmar.conf, which deploy.sh
# installs beside it as /etc/nginx/snippets/tarmar-scanner-block.conf. A probe
# for /.env, /.git/config, /wp-login.php and the like gets no response at all
# (nginx's 444 closes the connection) -- only the access-log line.
#
# The rules are a copy, taken 2026-11-10, of the generated file datahorde's
# other site includes (smarks/roots.origamisoftware.com,
# nginx-scanner-block.conf, produced there from scripts/scanner_patterns.py).
# Copied rather than included from that checkout so a change in that
# repository can never break a Tarmar deploy; when the source changes, copy it
# again and run the suite. tarmar_studio/tests/test_nginx_config.py runs every
# URL pattern this app serves, and its static and gate paths, through the
# expression and refuses any that it would drop.

location ~* "(?:\.env(\.|/|$))|(?:^/\.git(/|$))|(?:^/\.(svn|hg|bzr|aws|ssh)(/|$))|(?:^/wp-(admin|login|content|includes|json))|(?:^/(wordpress|wp)/)|(?:^/(phpmyadmin|pma|myadmin|mysql|sqlmanager|adminer))|(?:\.(php|asp|aspx|jsp|cgi|pl)(\?|$))|(?:^/HNAP1)|(?:^/actuator(/|$))|(?:^/_(profiler|ignition|debugbar)(/|$))|(?:^/(server-status|server-info)(/|$))|(?:^/(owa|ews|exchange|autodiscover)(/|$))|(?:^/(boaform|GponForm|setup\.cgi|currentsetting\.htm))|(?:\.\.[\\/])|(?:^/cgi-bin/)|(?:^/(config|backup|database|dump|credentials|secrets)\.(sql|json|zip|tar|gz|bak|old))|(?:^/(vendor|node_modules)/)" {
    return 444;
}
