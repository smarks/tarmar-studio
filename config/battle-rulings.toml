# The words a Game Master's rulings on a battle are shown in: the battle
# page's panels, the battle log's lines, and the refusals (issues #867, #37).
#
# Read once at startup (battle.wording.load_rulings_wording); a missing key, an
# unknown key or a {name} a sentence may not use stops the server there rather
# than in front of a player. BATTLE_RULINGS_WORDING_FILE names another file.
# Change the wording freely; keep each {name} a sentence uses, or drop it.

[common]
# How the page and the log name the Game Master who made a ruling.
game_master = "Game Master {name}"
# The word before the last of a list ("Channel, the push cap and ...").
and_word = "and"
# The word between natural totals on the turn menu ("paid only if it
# succeeds or the roll is 12 or 13").
or_word = "or"
# A figure no longer in the battle.
unknown_figure = "?"

# The turn menu: the line a seated player reads for each option, and what it
# costs (issues #788, #890, #56, #57, #90). [turn_menu] holds the words both
# profiles use, [tarmar_menu] a Tarmar figure's own and [classic_menu] a
# classic Melee figure's. A {line}, {reason}, {odds} or {cost} is another of
# these sentences, already filled; {aimed} names the figure an option is aimed
# at, and {weapon} is the_weapon or bare_hands.

[turn_menu]
the_weapon = "the {weapon}"
bare_hands = "bare hands"
# An attack's line and its chance to hit.
with_odds = "{line}: {odds}"
# Why a move stays put: {move} is tarmar_menu.clear_gait, or reach.
no_nearer = "no {move} gets nearer to {aimed}"
# Where a charge that falls short stops; {distance} is "2 hexes".
ends_from = "a {move} ends {distance} from {aimed}"
standing = "standing, since {reason}"
stand = "Stand where you are, since {reason}"
# How far a move goes: {move} is tarmar_menu.clear_gait or
# classic_menu.move_word.
reach = "{move} of up to {hexes} hexes"
no_attack_charge = "Charge {aimed}: no attack, since {reason}"
attack = "Attack {aimed} with {weapon}"
shoot = "Shoot {aimed} with {weapon}"
last_shot = "One last shot at {aimed} with {weapon}"
cast = "Cast {spell}"
cast_at = "Cast {spell} at {aimed}"
ready = "Ready the {weapon}"
ready_another = "Ready another weapon"
change_to = "Change to the {weapon}"
change_weapons = "Change weapons"
dropped = "the {weapon} is dropped"
pick_up = "Pick up the {weapon}"
stand_up = "Stand up; it takes the whole turn"
# What a hit does on average, in either profile's odds: under_one below
# half a point, else about.
under_one = "under 1"
about = "about {damage}"

[tarmar_menu]
# The chance to hit on the d20 ({sides}) and what a hit does; {average} is
# turn_menu.under_one or turn_menu.about.
odds = "{faces} in {sides} to hit, {dice} ({average} a hit)"
odds_armoured = "{faces} in {sides} to hit, {dice} less {stops} armour ({average} a hit)"
# {gait} is the engine's: run, sprint or jog.
clear_gait = "clear {gait}"
nearest_enemy = "the nearest enemy"
run = "Run up to {hexes} hexes toward {aimed}"
sprint = "Sprint up to {hexes} hexes toward {aimed}"
fatigue = "{fatigue} Fatigue"
fatigue_if_moving = "{fatigue} Fatigue, only if you move"
# {gait} is the engine's for a charge (jog).
charge = "Charge {aimed}: {gait} up to {hexes} hexes and attack with {weapon}"
# What Dodge and Defend guard against, in the rules page's words (a drift
# test holds these to special-combat-situations.md).
dodge_guards = "missiles and thrown weapons only"
defend_guards = "melee and non-missile attacks only"
dodge = "Dodge: +4 to your Target Number against {guards}"
dodge_standing = "{line}, {standing}"
dodge_toward = "{line}, jogging toward {aimed}"
defend = "Defend: +4 to your Target Number against {guards}"
# {gait} is the engine's for a placed drop (jog).
drop = "Drop prone where you stand, or first {gait} up to {hexes} hexes to a hex you pick"
leaves_hand = "the {weapon} leaves your hand"
press_again = "Press your countered {spell} again"
press_again_at = "Press your countered {spell} again at {aimed}"
pushing = "{line}, pushing {pushed} more mana into it"
push_cost = "{total} mana ({level} and {pushed} pushed), {paid}; a success makes a Control Roll"
cast_cost = "{mana} mana, {paid}"
# When a cast pays its mana; {totals} are the canon's natural totals, each
# pair parted by common.or_word ("12 or 13").
paid_on_success = "paid only if it succeeds"
paid_on_success_or_total = "paid only if it succeeds or the roll is {totals}"
borrowing = "{line}, borrowing the {owed} mana you lack"
borrowing_cost = "{cost}; paying it empties your pool and borrows the {owed} you lack as debt, and a debt roll follows the spell"
pressing_cost = "{cost}; a counter against it means another opposed roll, and countered again its mana is spent with no casting roll"
# Anchoring a runaway spell, with no Runaway rules loaded.
anchor = "Anchor a runaway spell"
self_anchor = "Take back control of your runaway {spell}: {dice} at or under your {attribute}"
helper_anchor = "Help {name} take back their runaway {spell}: {dice} at or under your {attribute}"
helper_anchor_cost = "{mana} mana, paid whether it holds or not"
helper_caught = "{cost}; if it fails, {spell} runs away from you too"
counter = "Counter {name}'s spell this turn, committing {mana} mana"
counter_cost = "{mana} mana, spent whether {name} casts or not"
an_enemy_caster = "an enemy caster"
step_away = "Step one hex away instead of attacking"
step_away_stuck = "{line}: {stuck}"
no_step_away = "with no hex picked you stay where you are, since no hex straight back from {threat} or to either flank is clear"
grapple = "Try to grapple {aimed}: a hold pins them rather than hurting them"
close_strike = "Strike {aimed} in close with {weapon}"
draw_dagger = "Try to draw your dagger: 3d6 at or under your DEX"
break_away = "Break away from hand-to-hand: 4d6 at or under your DEX"
break_away_stuck = "{line}; {stuck}"
break_away_steps = "{line}, then stand in a hex next to you"
struggle_free = "Struggle free of {aimed}: 4d6 at or under your DEX"
hold_still = "Hold still in {aimed}'s grip"
squeeze = "Squeeze {aimed}"
maintain = "Keep your hold on {aimed}"
release = "Let {aimed} go"
pick_up_any = "Pick up a weapon"
# An option yielded to Final Movement.
yielded = "{line}, moving in Final Movement instead"
yielded_blocked = "{line}, unless a way opens by Final Movement"
# A cast or counter past a bound a Game Master lifted; {past} is
# magic_bounds.past_by_ruling.
cost_past_ruling = "{cost}; {past}"

[classic_menu]
# A classic move, as reach and no_nearer name it.
move_word = "move"
no_foe_in_reach = "{reason}, with no foe in reach of {weapon}"
charge = "Charge {aimed}: move up to {hexes} hexes and attack with {weapon}"
# A charge that strikes a foe other than the one it closes on.
charge_another = "Charge toward {aimed}: move up to {hexes} hexes and attack {struck} with {weapon}"
charge_grapple = "Charge {aimed}: move up to {hexes} hexes and grapple them: {grapple}"
charge_grapple_another = "Charge toward {aimed}: move up to {hexes} hexes and grapple {struck}: {grapple}"
# What a grapple does, in the HTH ATTACK row's words (Melee p.17).
grapple_words = "move into their hex and fight hand to hand"
shift_attack = "Shift a hex and attack {aimed} with {weapon}"
# {dice} is "3d6"; {chance} a whole percent.
odds = "{needed} or less on {dice} to hit (about {chance}%)"
# The odds and what a blow does; {damage} is the weapon's dice, or
# charge_dice; {average} is turn_menu.under_one or turn_menu.about.
odds_damage = "{odds}, {damage} ({average} a hit)"
odds_damage_armoured = "{odds}, {damage} less {stops} armour ({average} a hit)"
# A pole weapon's extra die on a charge; {extra} is "1d6". Before armour
# the clause closes with a comma, so the armour reads as coming off the
# whole.
charge_dice = "{damage}, and {extra} more for the charge"
charge_dice_armoured = "{damage}, and {extra} more for the charge,"
move = "Move up to {hexes} hexes"
move_toward = "Move up to {hexes} hexes toward {aimed}"
half_move = "Move up to {hexes} hexes without attacking"
half_move_toward = "Move up to {hexes} hexes toward {aimed} without attacking"
# {how} is dodge_moving, dodge_moving_toward or turn_menu.standing.
dodge = "Dodge {how}: missiles and thrown weapons roll {dice} to hit you, not {plain_dice}"
dodge_moving = "while moving up to {hexes} hexes"
dodge_moving_toward = "while moving up to {hexes} hexes toward {aimed}"
shift_defend = "Shift a hex and defend: blows in melee roll {dice} to hit you, not {plain_dice}"
pick_up_any = "Pick up a weapon in reach"
crawl = "Crawl up to {hexes} hexes, staying down"
disengage = "Step away from the enemies engaging you"
hth_attack = "Grapple {aimed}: {grapple}"
cast_cost = "{strength} ST"
go_prone = "Drop prone where you stand"
kneel = "Drop to one knee"
do_nothing = "Hold where you are and do nothing this turn"
pass_turn = "Wait: choose after the others have moved"

# The turn panel's own words, around the menu's lines (issue #94): the prompt,
# each option's cost and the AI's pick, the push, borrow and counter controls,
# the cast stage, the hex picker and the buttons. The page fills these in
# itself, so each {name} is a bare name. {name} is the figure choosing, shown
# in bold; {player} the person playing it.
[turn_panel]
waiting = "Waiting for {name} to choose an action."
waiting_played = "Waiting for {name} — played by {player} — to choose an action."
# For whoever runs the battle, while another figure is awaited.
ai_choose = "Have the AI choose for them"
your_move = "Your move — {name}, turn {turn}. Pick one action."
# The options' name to a screen reader.
options_group = "Action options"
# The tag on the option the AI would take.
ai_pick = "AI pick"
# The AI's scoring, behind the switch: its score and its working.
advice = "score {score} — {rationale}"
show_scoring = "Show the AI's scoring"
hide_scoring = "Hide the AI's scoring"
# {cost} is the option's cost line, from [tarmar_menu] or [classic_menu].
costs = "Costs {cost}."
costs_nothing = "Costs nothing."
# The option that opens the spells.
cast_option = "CAST SPELL"
casts_ready_one = "1 cast ready"
casts_ready = "{count} casts ready"
# {count} casts only borrowing pays for.
ready_borrowing = "{ready}, {count} by borrowing"
# The cast option's working: {pool} is pool, {ready} the casts ready.
cast_advice = "{pool} — {ready}"
# The spells' name to a screen reader.
spells_group = "Spells"
# {pool_label} is the caster's pool's name (Mana, or ST in a classic battle).
pool = "{pool_label} {pool} of {max_pool}"
pool_owing = "{pool_label} {pool} of {max_pool}, owing {owed}"
# The cast stage's first line: {pool} is pool or pool_owing.
stage_pool = "{pool}. Pick a spell to cast."
# A spell that cannot be cast, when the server gives no reason.
not_castable = "not castable this turn"
stand_down = "Don't cast — pick another action"
push_label = "Push more mana:"
push_label_channel = "Push more mana (Channel {channel}):"
# The push control's first button: the cast with nothing pushed.
push_none = "None"
push_amount = "+{mana} mana"
# The push control's name to a screen reader.
push_group = "Push more mana into {spell}"
borrow_label = "Borrow the mana you lack:"
borrow_amount = "Borrow {borrowed} mana"
borrow_pushed = "+{pushed} mana, borrow {borrowed}"
borrow_group = "Borrow mana for {spell}"
# A counter's caster when the menu names none.
the_caster = "the caster"
counter_label = "Counter {caster}:"
counter_amount = "{mana} mana"
counter_group = "Counter {caster}'s spell"
# A pressed-again cast's note when the menu gave it no line.
presses_again = "Presses the countered spell again"
# The hex picker: {hex} is "(q, r)", {count} the hexes marked on the board.
moving_to = "Moving to hex {hex}."
pick_hex = "Pick one of the {count} marked hexes on the board to move there, or leave it and this action moves as it says."
leave_hex = "Leave the hex unpicked"
confirm = "Take this action"

[hth_agreement]
heading = "Hand-to-hand by agreement"
game_master_only = "Only the Game Master running this fight marks it, or a pair in it, as hand-to-hand by agreement; players alone still need one of the rules' ways in"
none_marked = "No pair is marked: a figure enters hand-to-hand only by one of the rules' ways in."
whole_battle_line = "A Game Master rules every pair of enemies in this battle may enter hand-to-hand by agreement."
pairs_line = "A Game Master rules these pairs may enter hand-to-hand by agreement: {pairs}."
pair_names = "{first} and {second}"
log_battle_marked = "{by} rules the whole battle hand-to-hand by agreement: every pair of enemies may now enter hand-to-hand"
log_battle_lifted = "{by} lifts hand-to-hand by agreement for the whole battle: pairs need one of the rules' ways in, or a pair marked singly"
log_pair_marked = "{by} rules {pair} hand-to-hand by agreement: they may enter hand-to-hand"
log_pair_lifted = "{by} lifts hand-to-hand by agreement for {pair}"
mark_whole_battle = "Mark the whole battle"
lift_whole_battle = "Lift the ruling for the whole battle"
lift_pair = "Lift"
mark_pair = "Mark this pair"
first_of_pair = "First of the pair"
second_of_pair = "Second of the pair"
refuse_scope = "Name the whole battle or one pair"
refuse_pair = "Name two different combatants in this battle"
refuse_pair_missing = "Name two combatants for the pair"
refuse_same_side = "{first} and {second} are on the same side"
refuse_classic = "Hand-to-hand by agreement is a Tarmar ruling; a classic battle plays Melee's own hand-to-hand"

[magic_bounds]
heading = "Magic bounds lifted"
channel = "Channel"
push_cap = "the push cap"
counter_bounds = "the counter's commitment bounds"
game_master_only = "Only the Game Master running this fight lifts a figure's magic bounds; players are held to the rules"
none_lifted = "No bound is lifted: every figure is held to {bounds}."
lifting_line = "{bound} lifted for {name} by {by}"
log_lifted = "{by} lifts {bounds} for {name}"
log_held = "{by} holds {name} to {bounds} again"
# Beside a menu option, and beneath its log line, when it goes past a lifted bound.
past_by_ruling = "past {bounds} by the Game Master's ruling"
figure_label = "Figure"
lift_button = "Lift for this figure"
hold_again = "Hold again"
refuse_bounds = "Name one or more of the bounds this canon imposes, which a Game Master may lift: {bounds}"
refuse_bounds_list = "Name the bounds as a list"
refuse_combatant = "Name a combatant in this battle"
refuse_classic = "Lifting a figure's magic bounds is a Tarmar ruling; a classic battle has no Channel, push or counter"

# The battle's own lines that are not a ruling (issue #136): the battle log's
# lines, the notes a fight's roster and seats carry, and a cast option's cost.
# {names} is a list of figures, already joined; the _one keys say it of one.
[services]
# Why a fight stops writing one character's record, once per character.
records_withheld = "{name}'s wounds and death are no longer written to their record: {reason}"
# The two {reason}s, by the kind of fight.
withheld_other_players = "the character belongs to another player, and the session's owner is no longer a Game Master"
withheld_not_game_master = "the battle counted because a Game Master ran it, and whoever made it is no longer a Game Master"
# {name} above when the figure is no longer on the roster.
a_character = "A character"
# A Game Master taking the pools from the records; {pools} is figure_pools for
# each figure, joined.
pools_taken = "The Game Master took the pools from the character records: {pools}"
figure_pools = "{name} Fatigue {fatigue_was}→{fatigue}, Body {body_was}→{body}, Mana {mana_was}→{mana}"
# Added to figure_pools where either side owes mana.
figure_owed = ", owed {owed_was}→{owed}"
# A restart.
stays_dead = "{names} stays dead: the record says so, and a restart does not bring anyone back. A Game Master revives a character on its sheet"
stay_dead = "{names} stay dead: the record says so, and a restart does not bring anyone back. A Game Master revives a character on its sheet"
stays_off = "{names} stays off the board: withdrawn from the session by the player who owns the character"
stay_off = "{names} stay off the board: withdrawn from the session by the player who owns the character"
# Seats.
seat_taken = "{game_master}, the Game Master, takes {name}'s seat: {owner}, who owns the character, is absent"
seat_returned = "{name}'s seat goes back to {owner}, who owns the character"
leaves_fight = "{name} leaves the fight: {owner}, who owns the character, withdrew them from the session"
# The end of a fight; {turns} is how many turns passed with nobody hurt.
team_victorious = "{team} stands victorious — {names} left on the field"
victorious = "{name} stands victorious"
stalemate = "Stalemate — {turns} turns without anyone hurt; {names} still standing"
# What a Tarmar roster lost crossing into a classic battle.
re_armed = "Re-armed from the classic weapon table: {names}."
no_spell_crosses = "No spell crosses into a classic battle: {names} enter as classic wizards, staff in hand and knowing the classic spells their IQ allows."
reach_no_spell = "{names} cast in Tarmar but reach no classic spell at this IQ, and fight as warriors."
# Characters with no weapon: before a session's fight, and on the board.
# The sheet's gear step says unarmed_one of its own character.
unarmed_one = "{names} carries no weapon and would fight bare-handed."
unarmed = "{names} carry no weapon and would fight bare-handed."
# Before a session's fight; {unarmed} is unarmed_one or unarmed, filled.
unarmed_attached = "{unarmed} Buy gear on the character's sheet before the fight."
bare_handed_one = "{names} is on the board with no weapon, fighting bare-handed."
bare_handed = "{names} are on the board with no weapon, fighting bare-handed."
# A player's choice in the log; {rationale} is the option's own line.
chosen_by = "chosen by {owner} — {rationale}"
# A seat nobody has claimed; {number} counts from 1.
open_seat = "Open seat {number}"
# A cast option's cost on the turn menu.
cast_cost = "{school} — {level} mana"

# Who decides for a figure, the roster card's line about it, and the log line
# a change of mode writes (issue #136). {mode} is automatic or manual below,
# {decided_by} a person's name or ai_owner.
[control]
ai_owner = "the AI"
# A guest has no name to print where a username would go.
guest_owner = "guest"
# The viewer, in manual_line on their own figure's card.
you = "you"
# Who decides in manual mode, for the whole battle.
their_owners = "their owners"
automatic = "automatic"
manual = "manual"
manual_line = "Manual — played by {owner}"
automatic_line = "Automatic — {ai} plays it"
every_combatant_follows = "Control: every combatant now follows the battle — {mode}, decided by {decided_by}"
battle_default = "Control: the battle's default is now {mode} — combatants without a mode of their own are decided by {decided_by}"
follows_again = "Control: {name} follows the battle again ({mode}) — decided by {decided_by}"
played_by_hand = "Control: {name} is now played by hand — decided by {decided_by}"
hands_to_ai = "Control: {name} now hands its decisions to {ai}"
