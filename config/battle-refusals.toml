# The words the battle app refuses a request in: one table per module that
# refuses, and the notes a guest reads beside a control (issues #97, #86).
#
# Read once at startup (battle.refusal_words.load_refusal_words); a missing key, an
# unknown key or a {name} a sentence may not use stops the server there rather
# than in front of a player. BATTLE_REFUSAL_WORDS_FILE names another file. Change the
# wording freely; keep each {name} a sentence uses, or drop it. Changing a
# sentence never changes who is refused.
#
# The words of a Game Master's rulings on a battle (hand-to-hand by agreement,
# lifted magic bounds) are in battle-rulings.toml.

[services]
# Setting up a battle and its muster.
guest_saved_characters = "Sign in to bring saved characters — a guest's battle is fought with generated fighters and catalog beasts"
character_twice = "A character cannot fight twice in the same battle"
# {ids}: the record numbers of the characters refused.
not_seatable_characters = "Not characters you can seat (they may have died or been deleted): {ids}"
