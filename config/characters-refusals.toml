# The words the characters app refuses in, and the phrase that marks a Game
# Master's call (issues #85, #97): one table per module, and the phrases more
# than one module uses.
#
# Read once at startup (characters.refusal_words.load_refusal_words); a missing
# key, an unknown key or a {name} a sentence may not use stops the server there
# rather than in front of a player. CHARACTERS_REFUSAL_WORDS_FILE names another
# file. Change the wording freely; keep each {name} a sentence uses, or drop
# it. Changing a sentence never changes who is refused.

[common]
# Ends a history line when a Game Master set what a player may not: "strength
# recorded as 22 (outside the 3-18 a player may set: the Game Master's call)".
the_game_masters_call = "the Game Master's call"
# Marks a check's line ("(a Game Master's call: unconscious)") and the skill
# check's option for a skill only a Game Master calls for.
a_game_masters_call = "a Game Master's call"

[services]
# What the sheet prints beside a value only a Game Master sets, for a player,
# and what a player's update of it is told (issue #748).
# {dice}: the canon's attribute dice; {points}: its point-buy total (#68).
field_attribute = "Rolled ({dice}) or bought ({points} points); only a Game Master can change a recorded score."
field_appearance_roll = "Rolled (1d6); only a Game Master can change it or qualify a 1 or a 6."
# {dice}: the canon's Fatigue roll.
field_fatigue_roll = "Rolled ({dice}) once; only a Game Master can change it."
# {dice}: the canon's literacy roll.
field_literacy_roll = "Rolled ({dice}) once; only a Game Master can have it rolled again."
# A literacy ruling at the origin the rules leave to the Game Master, the
# location row with no literacy check (issue #743).
literacy_ruling_game_master_only = "Only a Game Master rules on whether a character can read; a player's literacy is rolled"
# What an origin the rules leave to the Game Master is (issue #801).
# {origin}: that origin's name as the canon's location table gives it
# ("Consult GM"), read from the table (issue #151).
origin_ruling_game_master_only = "Only a Game Master rules what an origin of {origin} is"
# The same, under a canon whose every origin has a literacy check, so none is
# left to the Game Master (issue #151).
origin_ruling_no_origin = "Only a Game Master rules what an origin is, and every origin here has a literacy check"
# The Dragonborn secret (issue #810).
dragonborn_game_master_only = "Only a Game Master can set this."
field_provenance = "Rolled on the provenance table; only a Game Master can change it."
field_wealth_level = "Rolled on the wealth table; only a Game Master can change it."
field_starting_coin = "Set once by the wealth roll; only a Game Master can change it."
field_total_xp = "Earned in play or prior experience; only a Game Master can award it."
field_age = "Moves with years of prior experience; only a Game Master can change it."
field_free_skill_points = "Earned with XP; only a Game Master can grant more."
field_death = "Only a Game Master can mark a death or revive."
# Current Fatigue, Body and Mana and the mana owed (issue #751).
pools_game_master_only = "Only a Game Master can set current Fatigue, Body and Mana and the mana owed; a fight on the board records them on its own"
field_free_spell_points = "Spell Points from the Magic track; only a Game Master grants mana."
# The caster's school of magic and its roll (issue #18).
field_magic_school_roll = "Rolled (d100) once on the schools of magic; only a Game Master can roll it again."
field_magic_school = "Chosen once from the schools the school roll opens; only a Game Master can change it."
field_coin_adjustment = "Moves with purchases; only a Game Master gives or takes coin."
# An equipment item's modifiers (issue #752).
field_item_modifiers = "Item modifiers are a Game Master's grant; the rules give equipment none."
# A player's own choice once it was rolled: a roll is final (issues #948, #970).
roll_fixed_height = "Height was rolled, and a roll is final; only a Game Master can change it."
roll_fixed_weight = "Weight was rolled, and a roll is final; only a Game Master can change it."
roll_fixed_origin = "The Origin was rolled, and a roll is final; only a Game Master can change it."
# A field nobody sets by hand; {field}: its name.
nobody_sets = "{field} is not something anyone sets by hand."

# The purse (issue #136): how it prints, the history lines a coin movement
# writes, and why a purchase is refused. {coin} is an amount already printed
# ("12", "12.50"), {reason} what the coin moved for, {purse} the purse after.
[purse]
held = "{coin} gp"
# A Rich character's starting coin until a Game Master records it (wealth.md).
consult_gm = "Consult GM"
# Coin held while the starting coin is still consult_gm.
held_and_unknown = "{held} + {unknown}"
# {held} is what the purse holds; {unknown} is starting_coin_unknown, or nothing.
not_enough = "Not enough coin: {reason} costs {cost} gp and the purse holds {held} gp{unknown}"
starting_coin_unknown = " (the starting coin is Consult GM until a Game Master records it)"
paid = "paid {coin} gp ({reason}); purse {purse}"
received = "received {coin} gp ({reason}); purse {purse}"
# How the length refusal names a coin movement's reason.
label_reason = "Reason"
# A player buying before the wealth roll (issue #851), and what a Game Master's
# purchase then carries.
wealth_first = "Roll wealth first: nothing is bought before the starting coin is rolled, since the roll replaces the coin a purchase would have spent"
before_wealth_note = "Bought before the wealth roll, from the placeholder starting coin: the roll replaces that coin, and this purchase stays paid for"
# An item and how many, as a history line names them.
quantity_of = "{quantity} × {name}"
# A Game Master's gift; {item} is quantity_of.
given_by_game_master = "{item} given by a Game Master"
# A custom item a player may not add (issues #845, #927).
custom_combat_item = "A custom weapon, armour or shield is a Game Master's to add: the catalog publishes every item's numbers, and nothing lets a player invent better ones"
custom_item_price = "An item the catalog does not sell is bought at the price stated for it, and none was stated; only a Game Master gives one for nothing"
custom_item_more = "This item is carried at no cost, so more of it is a Game Master's to give"
# A carried item stored with no name.
an_item = "item"

# The point-buy note a bought set off its budget carries, and the name a
# character takes when nothing names it (issue #136). {off} is how far off.
[constants]
point_buy_over = "Point-buy total: {spent} — {off} over the {budget}-point budget."
point_buy_under = "Point-buy total: {spent} — {off} under the {budget}-point budget."
unnamed_character = "Unnamed character"

# A character that is not there, as the sheet's fetch-only endpoints answer it.
[views_access]
not_found = "Character not found"
